<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hi, Babe!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <span class="seal seal-top"></span>

    <div class="card-panel">
      <p class="card-kicker">Hi, Babe!</p>
      <h2 id="formTitle">Login</h2>

      <div class="toggle-buttons">
        <button type="button" id="showLogin" class="active">Login</button>
        <button type="button" id="showSignup">Sign Up</button>
      </div>

      <div class="input-group">
        <input type="text" id="username" placeholder="Username">
        <div id="userError" class="error"></div>
      </div>

      <div class="input-group" id="emailGroup" style="display:none;">
        <input type="email" id="email" placeholder="Email">
        <div id="emailError" class="error"></div>
      </div>

      <div class="input-group password-wrapper">
        <input type="password" id="password" placeholder="Password">
        <button type="button" class="toggle" id="togglePassword">Show</button>
        <div id="passError" class="error"></div>
      </div>

      <a href="#" id="forgotPassword" class="forgot-link">Forgot Password?</a>

      <button type="button" id="submitBtn">Login</button>

      <div id="message" class="message"></div>
    </div>

    <span class="seal seal-bottom"></span>
  </div>

  <script src="script.js"></script>
</body>
</html>
